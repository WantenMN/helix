name: Auto Release

on:
  schedule:
    # 每天北京时间 00:00（UTC 16:00）
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持手动触发

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: git fetch https://github.com/helix-editor/helix.git master

      - name: Check for upstream updates
        id: check
        run: |
          LOCAL=$(git rev-parse master 2>/dev/null || echo "none")
          UPSTREAM=$(git rev-parse FETCH_HEAD)
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream has new commits."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into release
        if: steps.check.outputs.changed == 'true'
        run: |
          # 更新本地 master
          git checkout master
          git merge --ff-only FETCH_HEAD
          git push origin master

          # 合并到 release 分支
          git checkout release
          git merge master --no-edit -m "ci: merge upstream/master"
          git push origin release

      - name: Create tag and trigger build
        if: steps.check.outputs.changed == 'true'
        run: |
          # 生成 tag：YY.MM.DD，同一天则递增后缀
          PREFIX=$(date -u +%y.%m.%d)
          LATEST=$(git tag -l "${PREFIX}*" --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            TAG=$PREFIX
          else
            LAST_NUM=${LATEST##*.}
            if [ "$LATEST" = "$PREFIX" ]; then
              TAG="${PREFIX}.1"
            else
              TAG="${PREFIX}.$((LAST_NUM + 1))"
            fi
          fi

          echo "Creating tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
